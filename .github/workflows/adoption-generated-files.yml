name: Adoption generated files

on:
  push:
    branches:
      - lmx/adoption
    paths:
      - Gemfile
      - package.json
      - .github/workflows/adoption-generated-files.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@v7
        with:
          ref: lmx/adoption
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      - name: Install Ruby dependencies
        run: bundle install
      - name: Generate Packwerk binstub
        run: bundle binstubs packwerk --force
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock package-lock.json bin/packwerk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate adoption lockfiles"
          git push origin HEAD:lmx/adoption
