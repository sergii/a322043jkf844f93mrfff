name: Regenerate Market Catalog structure

on:
  push:
    branches: [ chore/regenerate-market-catalog-structure ]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_TEST_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Use PostgreSQL 18 pg_dump
        run: |
          mkdir -p "$RUNNER_TEMP/pg18-bin"
          cat > "$RUNNER_TEMP/pg18-bin/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output_file=""
          args=()
          while (( "$#" )); do
            if [[ "$1" == "--file" ]]; then
              output_file="$2"
              shift 2
            else
              args+=("$1")
              shift
            fi
          done
          container_id="$(docker ps --filter ancestor=postgres:18.4 --format '{{.ID}}' | head -n 1)"
          docker exec "$container_id" pg_dump -U lmx "${args[@]}" > "$output_file"
          SH
          chmod +x "$RUNNER_TEMP/pg18-bin/pg_dump"
          echo "$RUNNER_TEMP/pg18-bin" >> "$GITHUB_PATH"
      - name: Load integrated SQL schema
        run: bin/rails db:schema:load
      - name: Apply Market Catalog migrations and dump structure
        run: |
          bin/rails db:migrate
          bin/rails db:schema:dump
      - name: Verify combined schema
        run: |
          grep -q "CREATE TABLE public.market_catalog_companies" db/structure.sql
          grep -q "CREATE TABLE public.market_catalog_job_openings" db/structure.sql
          grep -q "CREATE TABLE public.market_catalog_job_postings" db/structure.sql
          grep -q "CREATE TABLE public.market_catalog_opening_parties" db/structure.sql
          grep -q "CREATE TABLE public.market_catalog_resolution_decisions" db/structure.sql
          grep -q "CREATE TABLE public.market_catalog_posting_snapshots" db/structure.sql
          grep -q "CREATE TABLE public.source_runs" db/structure.sql
          grep -q "CREATE TABLE public.candidate_profile_versions" db/structure.sql
          grep -q "20260902013000" db/structure.sql
          grep -q "20260902100000" db/structure.sql
      - name: Run Market Catalog specs
        run: bin/rspec spec/models/market_catalog_core_spec.rb spec/services/market_catalog
      - name: Commit generated structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/structure.sql
          if git diff --cached --quiet; then
            echo "No structure changes generated"
          else
            git commit -m "Regenerate structure after Market Catalog migrations"
            git push
          fi
