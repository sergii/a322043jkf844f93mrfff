name: Generate Market Catalog structure

on:
  push:
    branches:
      - feat/market-catalog-core
    paths:
      - db/migrate/20260902013000_create_market_catalog_core.rb
      - db/migrate/20260902011700_establish_talent_profile_core.rb
      - .github/workflows/generate-market-catalog-structure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/market-catalog-core
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Load schema and apply migrations
        run: bin/rails db:drop db:create db:schema:load db:migrate
      - name: Dump Rails structure
        run: bin/rails db:schema:dump
      - name: Commit generated structure
        run: |
          if git diff --quiet -- db/structure.sql; then
            echo "db/structure.sql is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/structure.sql
          git commit -m "Regenerate Market Catalog structure"
          git push origin HEAD:feat/market-catalog-core
