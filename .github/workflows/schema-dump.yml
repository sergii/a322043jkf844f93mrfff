name: Schema Dump

on:
  pull_request:

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rebuild schema through migrations
        run: bin/rails runner 'ActiveRecord::Base.connection_pool.migration_context.migrate'
      - name: Dump structure with PostgreSQL 18
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:18.4 \
            pg_dump \
              --host "$POSTGRES_HOST" \
              --port "$POSTGRES_PORT" \
              --username "$POSTGRES_USER" \
              --schema-only \
              --no-privileges \
              --no-owner \
              "$POSTGRES_TEST_DATABASE" > db/structure.sql
          bin/rails runner '
            versions = ActiveRecord::Base.connection.select_values("SELECT version FROM schema_migrations ORDER BY version DESC")
            File.open("db/structure.sql", "a") do |file|
              file.puts
              file.puts %(SET search_path TO "$user", public;)
              file.puts
              file.puts %(INSERT INTO "schema_migrations" (version) VALUES)
              versions.each_with_index do |version, index|
                suffix = index == versions.length - 1 ? ";" : ","
                file.puts "(#{ActiveRecord::Base.connection.quote(version)})#{suffix}"
              end
            end
          '
      - name: Upload generated structure
        uses: actions/upload-artifact@v7
        with:
          name: generated-structure
          path: db/structure.sql
          if-no-files-found: error
