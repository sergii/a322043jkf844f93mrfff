name: Temporary Rails structure regeneration

on:
  pull_request:
    branches: [ lmx/adoption ]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Provide matching pg_dump 18.4 to Rails
        run: |
          mkdir -p "$RUNNER_TEMP/pg18"
          cat > "$RUNNER_TEMP/pg18/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          docker run --rm --network host \
            -e PGHOST="$POSTGRES_HOST" \
            -e PGPORT="$POSTGRES_PORT" \
            -e PGUSER="$POSTGRES_USER" \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD:$PWD" -w "$PWD" \
            postgres:18.4 pg_dump "$@"
          SH
          chmod +x "$RUNNER_TEMP/pg18/pg_dump"
          echo "$RUNNER_TEMP/pg18" >> "$GITHUB_PATH"
      - name: Regenerate Rails SQL structure
        run: |
          bin/rails db:test:prepare
          bin/rails db:migrate
      - name: Commit Rails-compatible structure
        run: |
          if git diff --quiet -- db/structure.sql; then
            echo "Structure already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/structure.sql
          git commit -m "Regenerate Rails schema for MatchAssessment"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
