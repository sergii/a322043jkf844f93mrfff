name: Adoption security update

on:
  push:
    branches:
      - lmx/adoption
    paths:
      - .github/workflows/adoption-security-update.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@v7
        with:
          ref: lmx/adoption

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Update vulnerable Rails and JSON dependencies
        run: bundle update rails json

      - name: Verify dependency audit
        run: bin/bundler-audit

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update vulnerable Rails and JSON dependencies"
          git push origin HEAD:lmx/adoption
