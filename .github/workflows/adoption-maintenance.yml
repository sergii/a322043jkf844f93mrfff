name: Adoption maintenance

on:
  push:
    branches:
      - lmx/adoption
    paths:
      - .github/workflows/adoption-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@v7
        with:
          ref: lmx/adoption

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Update Brakeman lock
        run: bundle update brakeman

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Format donor frontend
        run: npm run format:fix

      - name: Commit maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock app/javascript
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize adoption dependencies and formatting"
          git push origin HEAD:lmx/adoption
