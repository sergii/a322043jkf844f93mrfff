name: Temporary schema dump

on:
  pull_request:
    branches: [ lmx/adoption ]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Load current structure and apply pending migrations
        run: |
          bin/rails db:test:prepare
          bin/rails runner 'ActiveRecord::Base.connection_pool.migration_context.migrate'
      - name: Dump structure with matching PostgreSQL client
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/db:/dump" \
            postgres:18.4 \
            pg_dump --schema-only --no-privileges --no-owner \
              -h 127.0.0.1 -p "$POSTGRES_PORT" -U "$POSTGRES_USER" \
              --file /dump/structure.sql "$POSTGRES_TEST_DATABASE"
      - name: Commit generated structure
        run: |
          if git diff --quiet -- db/structure.sql; then
            echo "Structure already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/structure.sql
          git commit -m "Regenerate schema for MatchAssessment"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
